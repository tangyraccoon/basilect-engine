<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basilect Engine — Music Discovery</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0e0e12 0%, #1a1a24 50%, #0f1419 100%);
            color: #e8e8ed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        header {
            padding: 4rem 3rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, rgba(255, 97, 109, 0.1), rgba(255, 201, 58, 0.1), rgba(138, 43, 226, 0.1), transparent);
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, -20px); }
        }

        header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff616d, #ffc93a, #8a2be2);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 1;
            letter-spacing: -2px;
        }

        header p {
            font-size: 1.1rem;
            color: #a8a8b5;
            font-weight: 300;
            position: relative;
            z-index: 1;
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 2rem 3rem;
            background: rgba(30, 30, 40, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff616d, #ffc93a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.85rem;
            color: #808089;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.25rem;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem;
        }

        /* ===== CONTROLS ===== */
        .controls {
            margin-bottom: 3rem;
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            min-width: 250px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 97, 109, 0.3);
            border-radius: 8px;
            color: #e8e8ed;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-wrapper input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 97, 109, 0.8);
            box-shadow: 0 0 20px rgba(255, 97, 109, 0.2);
        }

        .search-wrapper input::placeholder {
            color: #6a6a76;
        }

        .filters {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 0.9rem;
            color: #a8a8b5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .tier-chips {
            display: flex;
            gap: 0.75rem;
        }

        .chip {
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: #a8a8b5;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .chip:hover {
            background: rgba(255, 97, 109, 0.2);
            border-color: rgba(255, 97, 109, 0.5);
            color: #ff616d;
        }

        .chip.active {
            background: linear-gradient(135deg, rgba(255, 97, 109, 0.3), rgba(255, 201, 58, 0.3));
            border-color: rgba(255, 97, 109, 0.8);
            color: #ffc93a;
        }

        select {
            padding: 0.6rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #e8e8ed;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 97, 109, 0.5);
        }

        select:focus {
            outline: none;
            border-color: rgba(255, 97, 109, 0.8);
        }

        /* ===== PAGE SECTIONS ===== */
        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== NAVIGATION TABS ===== */
        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
        }

        .nav-tab {
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: none;
            color: #a8a8b5;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-tab:hover {
            color: #ff616d;
        }

        .nav-tab.active {
            color: #ffc93a;
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1rem;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff616d, #ffc93a);
        }

        /* ===== DISCOVER PAGE ===== */
        .pair-cards {
            display: grid;
            gap: 2rem;
        }

        .pair-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 2rem;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .pair-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 97, 109, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .pair-card:hover::before {
            left: 100%;
        }

        .pair-card:hover {
            background: linear-gradient(135deg, rgba(255, 97, 109, 0.08), rgba(138, 43, 226, 0.08));
            border-color: rgba(255, 97, 109, 0.3);
            box-shadow: 0 0 30px rgba(255, 97, 109, 0.15), inset 0 0 30px rgba(255, 97, 109, 0.05);
            transform: translateY(-4px);
        }

        .pair-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .pair-rank {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff616d, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 60px;
        }

        .pair-artists {
            flex: 1;
        }

        .pair-artists-names {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .artist-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #e8e8ed;
        }

        .artist-name.link {
            color: #ffc93a;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .artist-name.link:hover {
            text-decoration: underline;
        }

        .pair-separator {
            color: #5a5a68;
            font-weight: 300;
            font-size: 1.2rem;
        }

        .pair-score-display {
            text-align: right;
        }

        .pair-score-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff616d, #ffc93a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .pair-score-label {
            font-size: 0.8rem;
            color: #a8a8b5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-bar-container {
            background: rgba(255, 255, 255, 0.03);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin: 1.5rem 0;
            position: relative;
            z-index: 1;
        }

        .score-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .pair-card.expanded {
            grid-column: 1 / -1;
        }

        .pair-details {
            display: none;
            position: relative;
            z-index: 1;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pair-card.expanded .pair-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .artist-detail-block {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .artist-detail-block h4 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: #ffc93a;
        }

        .artist-meta {
            font-size: 0.85rem;
            color: #a8a8b5;
            line-height: 1.6;
        }

        .meta-tag {
            display: inline-block;
            background: rgba(255, 97, 109, 0.15);
            color: #ff616d;
            padding: 0.3rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-right: 0.5rem;
            margin-top: 0.5rem;
        }

        /* ===== ARTISTS GRID PAGE ===== */
        .artists-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
        }

        .artist-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .artist-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(138, 43, 226, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .artist-card:hover {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.1), rgba(255, 201, 58, 0.05));
            border-color: rgba(138, 43, 226, 0.4);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2), inset 0 0 20px rgba(138, 43, 226, 0.05);
            transform: translateY(-4px);
        }

        .artist-card:hover::before {
            opacity: 1;
        }

        .artist-card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #e8e8ed;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .artist-card-meta {
            font-size: 0.9rem;
            color: #a8a8b5;
            line-height: 1.8;
            position: relative;
            z-index: 1;
            margin-bottom: 1rem;
        }

        .artist-card-meta strong {
            color: #ffc93a;
            font-weight: 600;
        }

        .artist-top-connection {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .artist-top-connection-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #808089;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .artist-top-connection-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ff616d;
            margin-bottom: 0.25rem;
        }

        .artist-top-connection-score {
            font-size: 0.85rem;
            color: #a8a8b5;
        }

        /* ===== ARTIST DETAIL PAGE ===== */
        .artist-detail-page {
            max-width: 900px;
        }

        .artist-detail-header {
            margin-bottom: 3rem;
        }

        .back-button {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: rgba(255, 97, 109, 0.15);
            border: 1px solid rgba(255, 97, 109, 0.3);
            border-radius: 6px;
            color: #ff616d;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255, 97, 109, 0.25);
            border-color: rgba(255, 97, 109, 0.6);
        }

        .artist-detail-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #e8e8ed;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .artist-detail-tags {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .detail-tag {
            padding: 0.5rem 1rem;
            background: rgba(255, 201, 58, 0.15);
            border: 1px solid rgba(255, 201, 58, 0.3);
            border-radius: 6px;
            font-size: 0.85rem;
            color: #ffc93a;
        }

        .connections-section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #e8e8ed;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .connections-pills {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .connection-pill {
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2), rgba(255, 97, 109, 0.2));
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 20px;
            color: #e8e8ed;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .connection-pill:hover {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.3), rgba(255, 97, 109, 0.3));
            border-color: rgba(255, 97, 109, 0.6);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.2);
        }

        .quotes-section {
            margin-top: 2rem;
        }

        .quote-item {
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #ff616d;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .quote-item:hover {
            background: rgba(255, 97, 109, 0.05);
            border-left-color: #ffc93a;
        }

        .quote-text {
            font-size: 1rem;
            color: #e8e8ed;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 0.75rem;
        }

        .quote-source {
            font-size: 0.85rem;
            color: #a8a8b5;
        }

        /* ===== MATRIX PAGE ===== */
        .matrix-container {
            overflow-x: auto;
            background: rgba(30, 30, 40, 0.4);
            border-radius: 8px;
            padding: 2rem;
        }

        .heatmap {
            display: inline-block;
            min-width: 100%;
        }

        .heatmap-row {
            display: flex;
            margin-bottom: 1px;
        }

        .heatmap-label {
            width: 120px;
            padding: 0.5rem;
            font-size: 0.75rem;
            color: #a8a8b5;
            display: flex;
            align-items: center;
            word-break: break-word;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .heatmap-cell {
            width: 40px;
            height: 40px;
            margin-right: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.6);
            position: relative;
        }

        .heatmap-cell:hover {
            transform: scale(1.2);
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 201, 58, 0.6);
            color: rgba(255, 255, 255, 0.9);
        }

        .heatmap-header {
            display: flex;
            margin-bottom: 1rem;
        }

        .heatmap-header-spacer {
            width: 120px;
        }

        .heatmap-header-cell {
            width: 40px;
            margin-right: 1px;
            font-size: 0.65rem;
            color: #a8a8b5;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.25rem;
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #ffc93a;
            padding: 0.5rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: nowrap;
            pointer-events: none;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 100;
        }

        .heatmap-cell:hover .tooltip {
            opacity: 1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .artists-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .artists-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 2.5rem;
            }

            .pair-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .pair-score-display {
                text-align: left;
            }

            .pair-card.expanded .pair-details {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-wrapper {
                width: 100%;
            }

            .filters {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
            }

            .tier-chips {
                width: 100%;
                justify-content: space-between;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1>BASILECT ENGINE</h1>
        <p>Discover unexpected connections between artists through their production philosophies</p>
    </header>

    <!-- STATS BAR -->
    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="stat-artists">14</div>
            <div class="stat-label">Artists</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-pairs">0</div>
            <div class="stat-label">Connections</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="stat-quotes">0</div>
            <div class="stat-label">Quotes Analyzed</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">0.52–0.89</div>
            <div class="stat-label">Score Range</div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <!-- NAVIGATION TABS -->
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showPage('discover')">Discover</button>
            <button class="nav-tab" onclick="showPage('artists')">Artists</button>
            <button class="nav-tab" onclick="showPage('matrix')">Matrix</button>
        </div>

        <!-- DISCOVER PAGE -->
        <div id="discover" class="page active">
            <div class="controls">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="Search artists, pairs...">
                </div>
                <div class="filters">
                    <span class="filter-label">Tier:</span>
                    <div class="tier-chips">
                        <button class="chip active" onclick="filterTier('all')">All</button>
                        <button class="chip" onclick="filterTier('high')">High (>0.83)</button>
                        <button class="chip" onclick="filterTier('mid')">Mid (0.72-0.83)</button>
                        <button class="chip" onclick="filterTier('low')">Low (<0.72)</button>
                    </div>
                </div>
                <select id="artistFilter" onchange="filterArtist()">
                    <option value="">All Artists</option>
                </select>
            </div>
            <div class="pair-cards" id="pairCards"></div>
        </div>

        <!-- ARTISTS PAGE -->
        <div id="artists" class="page">
            <div class="artists-grid" id="artistsGrid"></div>
        </div>

        <!-- MATRIX PAGE -->
        <div id="matrix" class="page">
            <div class="matrix-container">
                <div class="heatmap" id="heatmap"></div>
            </div>
        </div>

        <!-- ARTIST DETAIL PAGE (hidden by default) -->
        <div id="artist-detail" class="page artist-detail-page"></div>
    </div>

        let Q = {"animal_collective": {"quotes": [{"t": "I think we relate more to the nature of Maryland in positive memories and any kind of violence or stress in our music comes more from time spent in urban environments.", "p": "The Quietus", "d": "2009"}, {"t": "I think we appreciate the unpredictability of nature. Brian and I have always been big winter fans and I've definitely had experiences in Baltimore, Maryland which is definitely good for its snowstorms. That definitely influenced us a lot when we were younger, being stuck in certain places during st", "p": "The Quietus", "d": "2009"}, {"t": "I guess weather is a good example of nature. I was thinking more like animals. Weather however is a good example of something where we appreciate the violence and unpredictability of nature. Especially on this record.", "p": "The Quietus", "d": "2009"}, {"t": "It's hard for us to judge accessible or not but everybody seems to have a different opinion on all of our records. I feel like you get one opinion and then you get the complete opposite, y'know. Like we thought Strawberry Jam was difficult and abrasive but people were like 'Oh, it's like the most po", "p": "The Quietus", "d": "2009"}, {"t": "I think we're very fortunate in a way with recording. We're very conscious of how our music is produced and we pretty much are the producers and we have a hand in everything. But also the people we work with – right down to mastering and mixing – has an old school… I don't really want to say anti-in", "p": "The Quietus", "d": "2009"}, {"t": "But when we play live we like to have the loud moments and we like to have the quiet moments and if we compress everything there is none of that and it doesn't feel natural. We like our music to feel natural basically.", "p": "The Quietus", "d": "2009"}, {"t": "Now basically all the engineers we work with mastering and recording are against the 'loudness war' as everyone seems to be calling it. Especially in the mainstream commercial radio where there seems to be a school of thought that the louder a piece of music is the bigger the impact it will have on ", "p": "The Quietus", "d": "2009"}, {"t": "We didn't really start out to be the type of people who are like 'Oh, it must be as loud as it can be – just crank it!' you know? We've always been more about having dynamics and quiet and acoustic stuff and stuff that's a little more crazy. We never really even thought we had the amplifiers to actu", "p": "The Quietus", "d": "2009"}, {"t": "It becomes obvious to us when you compare one album by a group to another. For example we're all big Pavement fans and I love that album Crooked Rain, Crooked Rain. But if you compare that to later albums they, to us, sound a little more compressed and little more flat and we never really got into t", "p": "The Quietus", "d": "2009"}, {"t": "Nah, I think they were difficult for other reasons, for personal reasons. Totally different reasons. Here Comes The Indian, just because of the nature of the times, trying to figure out where we were in our lives, we were at that age, you know, having to work full time at other jobs in New York. The", "p": "The Quietus", "d": "2009"}, {"t": "One thing we talked about was definitely trying to use a lot more acoustic sounds and samples for source material because especially for Strawberry Jam the sound was a lot more crispy, or sharp which wanted it to be. And we hadn't done anything in a while that utilized a lot of acoustic sounds and f", "p": "The Quietus", "d": "2009"}, {"t": "It was kind of in a way like Noah's solo album was, sample based but not around other people's music and this one was sort of a similar sort of process. We were the band that was being sampled for the record and then put back together for the record.", "p": "The Quietus", "d": "2009"}, {"t": "We're conscious of that fact that we might all have the same pedals and I think that we know when we're messing around with the sound and I don't know for those other people but for us we know pretty quickly if it's a sound that's unique to one of those other people then it's off limits. It's not ju", "p": "The Quietus", "d": "2009"}, {"t": "Anyone who knows the band will hear it and think 'this is an Animal Collective record', but its textures and arrangements feel like new territory to us. The biggest challenge was making short songs. We'd grown accustomed to drawn-out structures that turn into six-minute tracks. But we wanted to expe", "p": "AnOther Magazine", "d": ""}, {"t": "Painting With is the first time we've written and recorded an album before playing it live. Things that work in the studio might not work on stage and vice versa – it's a real journey to discover this new life of a song.", "p": "AnOther Magazine", "d": ""}, {"t": "The studio is much more controlled and, at times, lacks the energy of the stage. It's like living in a secluded cottage in the woods and then trying to recreate that lifestyle in Manhattan. For us it doesn't work so we give ourselves up to the chaotic atmosphere the stage can have. We want each show", "p": "AnOther Magazine", "d": ""}, {"t": "It's about creating a world that the music exists in. In high school, we used to sit around listening to music in the dark. We'd listen to a whole record like [The Incredible String Band's] The Hangman's Beautiful Daughter or some [Krzysztof] Penderecki piece and talk about the images it brought to ", "p": "AnOther Magazine", "d": ""}, {"t": "We're all creatively restless so we're always trying to figure out new ways of doing things – it feels like a creative wave and you just sort of ride it. You're always feeding the knowledge you pick up into the next project.", "p": "AnOther Magazine", "d": ""}, {"t": "Everything is part of a system that works together. What makes the Animal Collective sound is each person's personality shining through in the mix. We are apart to be together.", "p": "AnOther Magazine", "d": ""}, {"t": "Each of our records represents a certain time period in our lives. It's like getting a tattoo, because you're really passionate about something. We don't get tattoos, we make records and they'll be with us till we die. There is so much we have yet to explore that it makes it constantly exciting.", "p": "AnOther Magazine", "d": ""}, {"t": "I was really lucky that my dad had a record collection with a few choice things that fell outside of the Stones, Dylan and blah-blah-blah. He had Wendy Carlos's Switched-On Bach, Isao Tomita, the Residents – I loved listening to \"Constantinople\" on repeat when I was a toddler. Jean-Michel Jarre and ", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "Brian and I discovered really early on in our friendship that we had a mutual interest in horror films. We had this night where we got snowed in, and opted to watch The Shining, which Brian had never seen. We had also taken some mushrooms. The Wendy Carlos soundtrack, with dark synths and delay on t", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "That was one side of it. Around the same time, '93 or '94, we were also super into Stereolab, Pink Floyd, the Grateful Dead – but particularly Pavement. We would see them live a lot. The early records, like Westing (By Musket and Sextant), had a lot of strange textures that you just knew weren't com", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "The same thing happened again. I saw a Roland SH-2 in a music room while visiting my brother on summer camp, and they just let me take it for free. Finding the input on the back of that was a massive advance for us. We would use it to run guitars through, double up as a vocals box, feed whole songs ", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "Noah and I attended a progressive school with a lot of emphasis on art, emotion and feeling. All through our grade school years we were learning music in standard ways, but also experiencing the joy and ecstasy of singing in groups. Noah got an 8-track cassette early on, and that brought an awarenes", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "Brian Eno's Music For Airports is something that really made an impression upon me as a teenager, as far as what you might call psych-electronic music. That and Aphex Twin really changed the course of my musical life. The dubby quality of a bunch of stuff from Germany – Kompakt, Basic Channel, Chain", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "Noah's interest in the Orb and Daft Punk didn't mesh with the rest of us right away. We were dropping acid, listening to Silver Apples and \"Interstellar Overdrive.\" We read about Joe Boyd, who produced the early Pink Floyd singles, in a magazine. He was talking about working with Syd Barrett, and th", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "We would play music together every night in Josh's mom's basement. It wasn't, \"Oh, let's have a band.\" It was sort of like, \"Let's have a band that sounds like this tonight, and let's have a band that sounds like that tomorrow. Let's have many bands!\"", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "So much of what we were doing as the band took shape was improvising together: turning the lights down, starting a recorder and just going. A group like Can made us realize ways existed to improvise, to hold onto the potential in that moment, while avoiding being academic about it. To find songs wit", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "I worked at the record store Other Music in the late '90s and early '00s with Noah. While I was there I discovered a lot of indigenous music from Africa, from the Bosavi Rainforest, field recordings of specific rituals and whatnot. It really interested me that music permeates their daily life to tha", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "That is sort of my M.O., on a general basis. I enjoy taking things that I find exciting, but maybe don't seem to fit together, and almost trojan-horsing these ideas into popular awareness. Trying to find ways of translating them, or putting them in a costume that is more familiar to people's ears.", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "I got to the point where it was like, \"Jesus, I think I can actually have a family now while still being a musician. I don't have to bifurcate my life in between this and what's considered 'proper adulthood.'\"", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "[Strawberry Jam] was a struggle to get through. Josh especially was having a really hard time. That recording process was the first time we ran into a situation where we weren't completely satisfied with what was happening. It's strange for us because that record is looked at very fondly, and it's a", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "An easy process doesn't always produce better results but, certainly in my memory, Merriweather sticks out as one of those cases. The songwriting was done separately at the beginning, which was uncommon and pretty difficult for us then, but they seemed to match up in terms of ambition. We figured ou", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "There was a tornado and a big thunderstorm when we were recording Merriweather, and it also rained all through the period of mixing in Athens, Georgia. Because we were in a rainy atmosphere – and because we are all what Noah calls \"light drizzle\" kind of personalities – that had a big influence. On ", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "The nature of our music didn't call for it to be very low end-y. Maybe on Here Comes The Indian, but that aside, we didn't even have a kick drum in the kit.", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "We were predominantly mid-range; maybe some bass in our harsh-sounding stuff, but not a lot of it. But it's pretty common for us to go fully the opposite way to that which we've been going, just to keep things interesting.", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "Every instrument in old reggae and early dub sounds exactly the way I want an instrument to sound. Merriweather was really the first time we wanted to hint at those influences, but marry the organic with the electronic.", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "I remember at the time talking about dub productions, as far as the bass is concerned. But when you listen to dub now it seems like a higher register bass. Contemporary hip-hop features a much deeper sub-bass element. Those sub-frequencies really aren't to some people's tastes, but that's kind of my", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "I still can't believe we lugged around six QSC speakers the whole time. My friend that owns a club was like, \"Why do you have those speakers? You realize you have the entire PA that I have in my club?\" But we were convinced that that's what we needed to be able to hear ourselves, and have everything", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "We weren't sure if it was going to be too electronic. We have such a diverse catalog, and some of our early fans came to us for Josh's guitar side. We really didn't know.", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "We wanted to make something that felt pleasing and immediate, but repeated listens would reveal a whole bunch of different things going on. I do like that you can kind of choose your own adventure with some of the songs, so to speak. Your brain latches on to one part of it and just sort of hovers ar", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "I remember seeing reviews along the lines of, \"They played a couple of the hits, but in between each one was six minutes of noodly abstract textural synth droning. What the fuck was that? Just get to the next song!\" To us, those moments are where the interesting things happen, and they're still a bi", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "Some early fans lamented that we were mostly stuck behind our stations of keyboards and samplers; that there was some loss of energy. When I moved to New York, I would go see real underground performances like Christian Marclay. But it's easy to overlook that, you know, maybe there weren't a ton of ", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "In some ways it's not that different from the era of playing with masks on. We want people to feel like coming to see us play is entering another world. We realized the intimacy of interacting onstage has a more limited impact when you're trying to translate that to someone that's standing hundreds ", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "We committed to a three-month period of living in the same city, showing up to practice every day, and writing from scratch. I was champing at the bit, and just felt revived as a human to be in the same space with them again. Moving the group back to physical instruments, and away from samplers.", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "I'm a little scared to address it, because I have very little to complain about in life. But yes, people seemed to like Tomboy quite a bit less than Person Pitch, even though in a lot of ways I felt like Tomboy was the superior thing. I remember being really beat up about it. So I think I said somet", "p": "Red Bull Music Academy Daily", "d": "2018"}, {"t": "Noah and I have talked to each other about how we surpassed our biggest dream in music after the first tour. We just were kids that wanted to make some music and print up some CDRs with some cool artwork and get in a van and drive to California and play a show. If we could do that then we've done it", "p": "Red Bull Music Academy Daily", "d": "2018"}], "meta": {"quote_count": 48, "source_count": 3, "date_range": ["2009", "2018"], "corpus_valid": true}}, "arthur_verocai": {"quotes": [{"t": "There were frequently live music programmes on all day, a big band interpreting different styles of Brazilian music like samba, bolero, baião or foxtrot.", "p": "HHV Mag", "d": ""}, {"t": "I listened sometimes, fell in love with the music and started borrowing my sister's practice books.", "p": "HHV Mag", "d": ""}, {"t": "While I read the lines, I listened to how the notes written on the instruments sounded and how they were grouped. That's how I learned how this music worked.", "p": "HHV Mag", "d": ""}, {"t": "I already knew then: I wanted to become a musical arranger. However, there was not a single course available in the whole of Rio. So I decided to work towards my goal on my own.", "p": "HHV Mag", "d": ""}, {"t": "The record company people approached me and asked me if I wanted to record an album. I was thrilled, but wanted to have full control over the creative process, that was my only demand – besides twelve violins, four violas, various cellos, a trumpet and a saxophone, as well as a trombone, two drums, ", "p": "HHV Mag", "d": ""}, {"t": "A good arrangement is what makes the music grow and become bigger.", "p": "HHV Mag", "d": ""}, {"t": "However, it wasn't my intention to sell millions of copies anyway. I just wanted to make my music without anyone from the outside interfering.", "p": "HHV Mag", "d": ""}, {"t": "I was sad because my work was not recognised. By now I know I did what I was supposed to do. And I don't regret a thing.", "p": "HHV Mag", "d": ""}, {"t": "The money was good, but I knew that no one in that milieu was interested in the music I was making. I guess that's why I stayed there. I wanted to flee from myself.", "p": "HHV Mag", "d": ""}, {"t": "I'm still grateful to these people. They made my work known later on.", "p": "HHV Mag", "d": ""}, {"t": "It was made during tough times in Brazil, when many lyrics were censored by the dictatorship. So, to avoid problems, Vitor had to use a lot of metaphors in the lyrics. 'Presente de Grego' meant that the dictatorship was a Trojan horse to Brazil, a bad gift. And 'Pelas Sombras' was about the way the ", "p": "Steppin' into Tomorrow", "d": ""}], "meta": {"quote_count": 11, "source_count": 2, "date_range": [], "corpus_valid": false}}, "astrid_sonne": {"quotes": [{"t": "It's difficult to experience your own piece of work from another person's perspective and eventually also difficult to know precisely what your music will evoke in the listener, which is something I find really interesting. It's important for me to produce music that is open, music that doesn't conc", "p": "Truants", "d": "2019"}, {"t": "I came across the word through an article and just fell in love with the sound of it. Clio is the muse of history and dynamics is movement over time and I think that really sums up the release. All the tracks share an inner mediation on memories and awareness of temporality and at the same time focu", "p": "Truants", "d": "2019"}, {"t": "I don't see the tracks as being different in style, I see them more as maybe different moods with different intensities. Although the tracks have contrasting expressions they still share a common ground in terms of form, compositional approach, sound material, etc. That being said, the vocal piece w", "p": "Truants", "d": "2019"}, {"t": "When putting the tracks together, Agnete (who is a part of Escho) and I were very much focused on dynamics, but nothing has been altered for them to fit each other. I like to think of the tracks as small islands you can inhabit for a while and then leave as you please.", "p": "Truants", "d": "2019"}, {"t": "I think I have subconsciously, but not intentionally. Of course you learn a lot about form, harmonic and melodic expression from listening and interacting with classical music, but I don't think about it as such when I compose. But thank you for the comparison, that's a nice one!", "p": "Truants", "d": "2019"}, {"t": "To be honest, I don't feel like there's a category that I don't like to be put in as long as I express the things that I feel like expressing. I've just always been into such a broad variety of things, so I think that reflects in the music as well.", "p": "Ableton", "d": ""}, {"t": "Vocals and choir-ish pieces have been present in my work for years, and that's also very much my own background. I used to sing in church choirs when I was young. All my instrumental music for me holds the same personal expression, but obviously, using your voice and lyrics is a more direct form of ", "p": "Ableton", "d": ""}, {"t": "I was doing this score for a short film and they asked me to do a cover or a reinterpretation of that Mariah Carey track.", "p": "Ableton", "d": ""}, {"t": "I felt a lot of freedom and I felt like, okay, I can just go nuts now.", "p": "Ableton", "d": ""}, {"t": "It's almost like having an alias or something where you don't think too much about it, you just do something.", "p": "Ableton", "d": ""}, {"t": "I've never really listened to that music, but I really enjoyed working with these lyrics and that track opened up a new way of working for me. So it's very important in that sense.", "p": "Ableton", "d": ""}, {"t": "I was pursuing a classical career when I was younger, but then I stopped when I was 18 because I felt really restrained.", "p": "Ableton", "d": ""}, {"t": "I've had this tendency of really wanting to separate things – this is the synthesizer, this is the voice, this is the viola. Whereas on this album, the focus for me has been on orchestrating and pushing myself to combine more of those elements.", "p": "Ableton", "d": ""}, {"t": "We just recorded the drums from different mics, different positions around in the room and in the hallway. At the time, I had no idea what to do with that material. It was more like an experiment. Then later I made a sample bank in Ableton, and then I just slowly started using it. And the last bit o", "p": "Ableton", "d": ""}, {"t": "The process of making this album is processing and manipulating back and forth between audio and MIDI and trying to push the material, spread it out and kind of see what I can get out of that cool material.", "p": "Ableton", "d": ""}, {"t": "I was watching this tutorial with, maybe Bruce Springsteen? I can't remember. Or another guitarist. I sampled it and then I recorded it, and then I transformed it, converted it to MIDI. And then I put an arpeggiator on it and formed a rhythmical pattern.", "p": "Ableton", "d": ""}, {"t": "I do loads and loads of sampling, but then sometimes, for instance, with, \"Say you love me\", the original track is \"Overture\". So the guitar sample in \"Overture\", I was singing on top of that, but there was too much going on. So I made \"Overture\" as a separate track and then I did new chords, which ", "p": "Ableton", "d": ""}, {"t": "I moved to London one and a half years ago, and the first year I lived here I was ill all the time. So this is a fever session with me trying to get some sunlight in a park, and I did those lyrics. It was this feeling of coming out of something. I'm really fever-high, and I can't really understand w", "p": "Ableton", "d": ""}, {"t": "I want there to be space. When I'm writing music, I think a lot about trios or duos. So when I look at it, [I ask myself] what is going to be the duo? What is going to be the trio? Then I can kind of tell if elements stand the test. I don't want to put anything in it that doesn't really need to be t", "p": "Ableton", "d": ""}, {"t": "This is what I came up with in that process, and maybe in the next album it's going to sound completely different. I have no idea. Maybe I won't even use my voice. It's been really interesting and very difficult, but also really rewarding. It's an interesting place at the moment, for sure, I don't k", "p": "Ableton", "d": ""}, {"t": "I started composing in the beginning of my 20s. Early influences include listening to postmodernism and minimalism, the Copenhagen noise scene at that time, singing in a classical choir and playing in a jazz band. Searching for a place of belonging musically. When I was around 18, a person I was ver", "p": "15 Questions", "d": ""}, {"t": "Actually what drew me to making music myself, and especially electronic music, was a feeling of not having to create the same way that other people did. Of course I'm inspired by other people's music, but it felt really liberating to make music in this way and it felt like there was no specific scho", "p": "15 Questions", "d": ""}, {"t": "This is a challenge I think everyone faces in the beginning, but I wasn't technically skilled enough to execute my ideas. And I worked at a really slow pace, I still do. Of course I've gotten more technically skilled over time, but in a way that also influenced my creative process in a limiting way.", "p": "15 Questions", "d": ""}, {"t": "To me, working with time and changes over time is an intuitive thing that depends very much on the material you're working with, especially when you're not working with a fixed form like a pop song or a fugue. Sometimes it's material that wants to move forward very quickly and sometimes it wants to ", "p": "15 Questions", "d": ""}, {"t": "I don't think you can seperate the sound aspect from the composition aspect, to me they are inseparable and influence each other in various ways. Rather than working with sound and timbre in order for them to meet production ideas, I try to bring out different musical parameters from the material I'", "p": "15 Questions", "d": ""}, {"t": "Collaborations to me depend very much on a personal connection in order to create a safe and open space where you can be creative. I really like when you're able to put your own ego aside and create something equally together. For me personally, the circumstances are very important. I like when ther", "p": "15 Questions", "d": ""}, {"t": "When I'm able to just let go and have fun. When I'm not overthinking every choice I make but just do it. Music is only something because of the value you add to it. I have a tendency of being too much in my head, overthinking etc. That's really toxic for the creative mind. Now I focus a lot on havin", "p": "15 Questions", "d": ""}, {"t": "The way I approach my practice as an artist is tightly connected to transferring energies and to create some sort of emotional relatedness with the listener. I want to create rooms in my music for people to be in. A sonic world building or a strong sonic integrity. How these moods, rooms and energie", "p": "15 Questions", "d": ""}, {"t": "To me, music can express another dimension. It is communication beyond words. Something that you cannot point out or analyze. To me, music is a value within. It's abstract, it's untouchable, it's spiritual, mystical. And I think in that sense it can express things about life and death that we don't ", "p": "15 Questions", "d": ""}, {"t": "Audio processing is really close to how I work, and I like taking a piece of sound and trying to get something new out of it. In that sense, making a remix is quite natural. But then there's this thing where it needs to have some connection to the original track, so I'm just trying to find the right", "p": "Tone Glow", "d": ""}, {"t": "I could do my own thing without anyone else telling me how to do it. I think that was just a big release of finally finding this tool.", "p": "Tone Glow", "d": ""}, {"t": "The jazz band, especially, even though I wasn't really into the music (laughter), it was led by this old-school jazz saxophonist. I think he really wanted a string player as part of the band so he took me under his wing and taught me how to improvise. And playing classical viola never gave me the to", "p": "Tone Glow", "d": ""}, {"t": "I was only diving in, which meant that everything took so much longer but, in a sense, I felt like I made my own methods instead of copying techniques.", "p": "Tone Glow", "d": ""}, {"t": "My relationship to my viola was really difficult. I had to divide my practice and that's still something I struggle with. When I first started doing music, I'd be quite obsessed with one sound and I told myself that it'd be the only sound I'd use throughout a track. It's been difficult for me to orc", "p": "Tone Glow", "d": ""}, {"t": "I think the main thing I learned about collaborating is to give more freedom to the people I'm playing with. In general, it was about letting things go and experiencing their interpretation of the music instead of saying things like, 'This is how it's supposed to be.' I think that has something to d", "p": "Tone Glow", "d": ""}, {"t": "With the musicians that I work with now, when we started rehearsing for the live shows, I didn't give many instructions; I just wanted to give out the music and say, 'What can we do with this?' This wasn't about not taking responsibility—I'm happy to take the lead on things—but I would also like for", "p": "Tone Glow", "d": ""}, {"t": "I realized with outside of your lifetime that everything I was trying to get away from, I was actually reproducing it. When I did \"Strong, Calm, Slow,\" I was not very nice. I was really strict, saying, \"This is wrong, this is right.\" And it's good to be like that sometimes, but right now I'm very mu", "p": "Tone Glow", "d": ""}, {"t": "I was always way more afraid of it and now I feel I can embrace it. And in order to push yourself, you kind of need to go out there, in a way where you can't always trust yourself. Or to where it feels scary. You need to do something that doesn't always feel the best. You have to challenge yourself.", "p": "Tone Glow", "d": ""}, {"t": "This track is the most personal one. 'Say you love me' started off as being just the vocals on top of the guitar loop that you hear on the song before it, 'Overture.' Once I added the drums it became too much and I separated it into two tracks. There were things going on in my personal life; I had b", "p": "Tone Glow", "d": ""}], "meta": {"quote_count": 38, "source_count": 4, "date_range": ["2019", "2019"], "corpus_valid": false}}, "badbadnotgood": {"quotes": [{"t": "We just look at it as we make a smorgasbord of music. We sit in a weird pocket.", "p": "Vice", "d": "2016"}, {"t": "We're not trying to be a jazz band. We're just trying to make music.", "p": "Vice", "d": "2016"}, {"t": "When we work on music it's the most fun for us when we're not sticking to any one thing. We just try and be open.", "p": "Vice", "d": "2016"}, {"t": "When we started to look at it and see how different some of the songs would be between the most soulful groovy songs versus something that's much more crazy with an up-tempo jazz improv vibe. It was looking kind of weird. We were like \"I don't know if it makes a lot of sense.\" But I've grown to appr", "p": "Vice", "d": "2016"}, {"t": "It was definitely working on it track by track. We almost never have a unifying kind of idea or theme. We just work on the music that seems to come out of us at that time. For this one, especially since we put out III, we've broadened our horizons a lot in what we listen to and also gotten the chanc", "p": "Vice", "d": "2016"}, {"t": "I don't know. I can't really think of one thing because different collaborations have come at different times. But early on when we were doing rap covers it was just cohesiveness with being able to create familiar feelings of beats and then being able to add solo-y functionality to that. We don't re", "p": "Vice", "d": "2016"}, {"t": "Because of the internet and all this accessibility and promotion that you can have intentionally it just creates this crazy cohesive world. And then you play festivals and meet these people. Then you're at a show talking to a rapper you admire and being inspired and having your mind blown. It's just", "p": "Vice", "d": "2016"}, {"t": "We come from a music school background where we were learned jazz heavily, and to this day the approach to learning music that jazz musicians have and the approach to playing is a part of what we do. We try to keep that jazz spirit, but it's combined with so many other things. It's a lens that we lo", "p": "Vice", "d": "2016"}, {"t": "We look at what we do as approaching music with jazz training. We use the jazz language when we're writing, but we're not proficient. We're not the top musicians of the genre, so we don't try to assume ourselves as prolific innovators because jazz has this history of boundary-pushing limitless const", "p": "Vice", "d": "2016"}, {"t": "I think it's becoming more natural. I don't think it was at first. In terms of music school you don't really learn about that kind of a world being the predominant industry that we have now. I think early on—dating back to when Tyler, the Creator came into our space and we jammed—you just realize th", "p": "Vice", "d": "2016"}, {"t": "As a music fan myself, as soon as I hear something I do associate it with one artist or two artists because you want to somewhat log in your brain what familiar sounds or feelings you might be hearing. But at the same time that can be a stubborn way of approaching it and not reading into the depths ", "p": "Vice", "d": "2016"}, {"t": "Since we recorded and released III, we've been writing tons and tons of stuff inspired by all different sources. We were touring heavy after the release so we got exposed to a huge range of really talented artists at different festivals, and had many friends putting us on to great music from the pas", "p": "Howl & Echoes", "d": "2016"}, {"t": "It wasn't very conscious when we were writing everything. We didn't have any idea what the album would end up like, and I think the spread that happened is an honest reflection of where we are at musically. Making music is so fun for us it's impossible to stick to one sound!", "p": "Howl & Echoes", "d": "2016"}, {"t": "The song with Sam Herring came about because we did a remix of \"Seasons\" by Future Islands in 2014. As part of that agreement, us and Sam were supposed to get together at some point to work on original music. He came through our studio last fall and we spent three days in a magical creative journey!", "p": "Howl & Echoes", "d": "2016"}, {"t": "Hyssop of Love came about in much the same way. We had been fans of Mick's music because he's an incredibly talented rapper/lyricist, and got the chance to meet in the studio last summer through a Red Bull session. The song was again made in our studio, with all of us in the same room recording, whi", "p": "Howl & Echoes", "d": "2016"}, {"t": "Very difficult! I think we kept having the problem that we would like a few songs together, and then the rest as stand-alone tracks. Until we just committed to making it work we had no idea what the tracklist was going to be. Even then we were skeptical on it, but our final thoughts were basically t", "p": "Howl & Echoes", "d": "2016"}, {"t": "It's very spontaneous! For some songs they'll evolve from a little idea someone has, but they always go through a stage where all four of us play them in the room and try random ideas. It was great to write the feature songs with all the different artists, adding another mind to the process is reall", "p": "Howl & Echoes", "d": "2016"}, {"t": "You're totally on the mark! The vast majority of the music we listen to is from the 60's and 70's. We're obsessed with Brazilian music, which is where a lot of those elements come from. We also have a deep love for old soul, psych, and jazz music, and newer electronic and hip-hop stuff, but the over", "p": "Howl & Echoes", "d": "2016"}, {"t": "We just try to make the music we like that combines all our different influences! We wouldn't even call ourselves jazz musicians necessarily, although jazz determines how we write and play everything. It's such a valuable field of music and if you learn anything about jazz it's applicable in any sit", "p": "Howl & Echoes", "d": "2016"}, {"t": "This album is simultaneously our most accessible and inaccessible. There are so many different styles on it. Everything from Brazilian music to soul music.", "p": "Bandcamp Daily", "d": ""}, {"t": "If you discover it and don't know who we are, but you find something in there, that's one of the best feelings.", "p": "Bandcamp Daily", "d": ""}, {"t": "Music is getting wider and more creative. In hip-hop and in the world of production, you're getting new chord progressions. Things need to get fresh and stay fresh.", "p": "Bandcamp Daily", "d": ""}, {"t": "From our perspective, it went over fine, because it's what we like to do. I can't remember exactly what it was, but there was this disconnect over the music being something that the teachers hadn't heard.", "p": "Bandcamp Daily", "d": ""}, {"t": "Arthur Verocai is a legend. He's such an incredible arranger and composer, and part of so many important records coming out of Brazil. It was an honor to work with him. He's been such a big influence of ours, almost ever since we started the band, ever since someone showed us his music.", "p": "Complex", "d": "2021"}, {"t": "All these different factors of his music, we aspire to have as well—in the way we compose, in our production, and in our improvisation. The collab was done over the pandemic via email. But it would've been super magical to see his creative process in person.", "p": "Complex", "d": "2021"}, {"t": "Overall, half and half. Sometimes doing it via email makes more sense, especially if the artist lives far away. But we make an effort to go meet wherever they are, or get them to come to us in Toronto, when we can. Because it's nice to have that physical meeting. For this record, we were lucky enoug", "p": "Complex", "d": "2021"}, {"t": "It starts with him as a producer, and him as an instrumentalist. He's a direct inspiration for what we do. When we were on tour in 2019 we saw him perform six or seven times with Christian Scott and Robert Glasper in the band. The magic of seeing them perform live—not that it's something I've experi", "p": "Complex", "d": "2021"}, {"t": "The music is concise and there was a lot of improvisation. It was a very focused writing period, and we made a conscious effort to make the album flow as a unit. We're just excited for people to hear it, and see where we are now as musicians. It was an incredibly fun recording process and very creat", "p": "Complex", "d": "2021"}, {"t": "Since a lot of it was improvisation-based, it forced us to be more vulnerable and go deeper into the emotional aspects of each song.", "p": "Complex", "d": "2021"}, {"t": "I wasn't burned out from the band, but I was burned out from being on the road all the time. I felt really fortunate to tour so much, but it's really draining and hard to keep going forever. We each pursued different projects after the last tour and were able to enjoy life a bit more. That was more ", "p": "Complex", "d": "2021"}, {"t": "The past year and a half was the most productive we've ever had, musically. Because of the pandemic, we had nothing else to do but record. Apart from this album, each of us had been working on other stuff. It was a nice time to be able to be creative, and see where we can go next.", "p": "Complex", "d": "2021"}, {"t": "We're trying to work in more visual elements. And also when we were working on this album, our first thought was: \"This will be great live, and we can play each song in a row and make it flow together.\"", "p": "Complex", "d": "2021"}, {"t": "Definitely. When we recorded this new album, we could mimic what the live show does in terms of a true performance, with no editing. Having improvisation be such a big part of it led to a more raw and honest depiction of what the songs were trying to bring out of us.", "p": "Complex", "d": "2021"}, {"t": "We would record to tape, so not exactly. But we'd hyper analyze every part, and decide upon the perfect envelope for this synth, or listen intently to come up with the perfect phrase for that woodwind. Talk Memory is about trying to let the music breathe more.", "p": "Complex", "d": "2021"}, {"t": "For a lot of strong vocalists—and everyone we've been able to work with has been extremely strong—part of the process has been connecting who you are as a person to your art form. So I think there's virtuosic limitations with vocals that aren't as inherent as playing an instrument. But there's such ", "p": "Complex", "d": "2021"}, {"t": "And yet, we've had a bunch of sessions with Moses Sumney, and even as a vocalist and all the limitations that come with that compared to an instrument, he seemingly has no limitations. As a saxophonist, he's probably a better tactician with his voice than I am on an instrument where I can push butto", "p": "Complex", "d": "2021"}, {"t": "I guess people label it jazz but we don't really call it jazz because we use jazz as almost a tool when we're composing and writing songs. But there's also elements of rock music, Brazilian music, electronic music, soul music. It's all over the place. It's really hard to describe… it's very unique, ", "p": "Loud and Quiet", "d": "2021"}, {"t": "We're not really concerned about keeping the tradition. We spent a lot of time studying it and using a lot of the tools we learnt from studying it – the theoretical and harmonic aspects. It's stuff we use literally every day. But really, at the end of the day when we're writing, all we're really try", "p": "Loud and Quiet", "d": "2021"}, {"t": "We used the physical studio vibe to create a cohesion, to work on it step-by-step together and to get how it feels having the vocalist or musician play right there – to share a vision. It's really important and it's a totally different feeling on this record because of that.", "p": "Loud and Quiet", "d": "2021"}, {"t": "The only person on a hit list, so to speak, was Colin Stetson. I went to high school with Charlotte Day Wilson; Sam Herring we did a Future Islands remix of previously so we were in touch; Mick Jenkins we knew and Kaytranada is a good friend of ours who we've been doing music with for the last year ", "p": "Loud and Quiet", "d": "2021"}, {"t": "That was really amazing, for me. I've been listening to him his entire career; I'm a huge fan of his. He has just completely changed the approach of how he interprets the saxophone and it was really amazing to stand beside him and be there for his whole process. His general stamina to playing too, h", "p": "Loud and Quiet", "d": "2021"}, {"t": "It has to be someone we can get along with in a lot of different settings, to have a good time with them. There's a million super talented musicians out there but finding someone you resonate with, there's not. We've been lucky with everyone we've met. Sometimes it's intimidating when dealing with s", "p": "Loud and Quiet", "d": "2021"}, {"t": "I think we're really focusing on keeping things original at this point. The covers we have been doing are just a fun aspect of the live show that the audience can latch onto if they know the songs. From a production standpoint we're definitely focused on just coming up with new ideas right now.", "p": "Loud and Quiet", "d": "2021"}, {"t": "I feel like jazz seems to be on the rise right now in terms of popular music, especially through people like Kamasi Washington and the whole Brainfeeder family, and they've always been a huge inspiration for us, so I think working with anybody like that – Flying Lotus, Thundercat – would be really a", "p": "Loud and Quiet", "d": "2021"}], "meta": {"quote_count": 43, "source_count": 5, "date_range": ["2016", "2021"], "corpus_valid": true}}, "bill_evans": {"quotes": [{"t": "It was not like an ambition where you sit down and say, 'Well, I'm going to be a jazz musician and then I'll buy a book of hot licks.'", "p": "JazzProfiles", "d": ""}, {"t": "There's a particular attitude, I think, sort of an instantaneous response or something like that... In jazz it would all have a certain similarity because it has to be within a certain area of facility and knowledge, and that's the difference because your feeling sends out sort of a motivation and t", "p": "JazzProfiles", "d": ""}, {"t": "There's nothing more degrading to me than to think of 70 or 80 musicians who have become almost machines serving this one thing... you have got to have your own identity as well, in an expressive way.", "p": "JazzProfiles", "d": ""}, {"t": "It's a skill, it's not an intellectual thing at all. It's intellectual only in the sense that you use your mind to learn the skill, but it's not intellectual in conception.", "p": "JazzProfiles", "d": ""}, {"t": "I live my life for music, in a way. It's almost as if it's made me want to be a good person just for the sake of music.", "p": "JazzProfiles", "d": ""}, {"t": "I never really strive for that kind of originality — avoiding anything anybody's done — because that's the only way I've learned, in a way.", "p": "JazzProfiles", "d": ""}, {"t": "Like jazz, you can't explain it to anyone without losing the experience. It's got to be experienced, because it's feeling, not words. Words are the children of reason and, therefore, can't explain it. That's why it bugs me when people try to analyze jazz as an intellectual theorem. It's not. It's fe", "p": "JazzProfiles", "d": ""}, {"t": "I heard the fellows in his group building their lines with a design and general structure that was different from anything I'd ever heard in jazz.", "p": "JazzProfiles", "d": ""}, {"t": "I'm always looking to reflect something that's deeper than what I've been doing.", "p": "JazzProfiles", "d": ""}, {"t": "You try to express a simple emotion — love, excitement, sadness — and often your technique gets in the way. It becomes an end in itself when it should really be only the funnel through which your feelings and ideas are communicated. I've always had good facility, and that worries me. I hope it doesn", "p": "JazzProfiles", "d": ""}, {"t": "Now I'm back to where I was before I went in the army. I don't give much of a damn now what anybody thinks. I'll do what I think should be done.", "p": "JazzProfiles", "d": ""}, {"t": "I want to grow, but I don't want to force it. I want to play as good as I can, not necessarily as different.", "p": "JazzProfiles", "d": ""}, {"t": "I always like people who have developed long and hard, especially through introspection and a lot of dedication. I think what they arrive at is usually … deeper and more beautiful … than the person who seems to have all the ability and fluidity from the beginning.", "p": "JazzProfiles", "d": ""}, {"t": "All of it was more or less created out of the musicians themselves.", "p": "JazzProfiles", "d": ""}, {"t": "First take feelings are generally, if they're anywhere near right, they're generally the best.", "p": "JazzProfiles", "d": ""}, {"t": "In jazz, it's gotta be 'bing' and that's it... locking into an almost subconscious process... Speaking from some levels of yourself that you're not even aware of.", "p": "JazzProfiles", "d": ""}, {"t": "Those kind of people, when they finally do arrive at their own expressive level, to me, seem to contain so much more.", "p": "JazzProfiles", "d": ""}, {"t": "Style's the hardest thing to get, and it's not something you really strive for.", "p": "JazzProfiles", "d": ""}, {"t": "Being myself was the only place to be.", "p": "JazzProfiles", "d": ""}, {"t": "Intuition has to lead knowledge but it can't be out there on its own. If it's on its own, you're going to flounder sooner or later.", "p": "WordPress", "d": ""}, {"t": "Knowing the problem is 90% of solving it.", "p": "WordPress", "d": ""}, {"t": "The problem is to be clear and get down to basic structure.", "p": "WordPress", "d": ""}], "meta": {"quote_count": 22, "source_count": 4, "date_range": [], "corpus_valid": false}}, "bladee": {"quotes": [{"t": "When I was thinking this shit up in my head, it wasn't possible before us and Sad Boys. I don't even feel like there's a good genre to describe the music we're doing. I just want to make popular music.", "p": "The FADER", "d": "2019"}, {"t": "It's definitely a bit outdated. Now with the Internet, everything is one thing basically, and everything is inspired by another thing. All music today takes inspiration from hip-hop. Genre is limiting yourself. Just be yourself and let that be the genre, and you can do whatever you want.", "p": "The FADER", "d": "2019"}, {"t": "We did experiment, so at some point it was experimental. But now it's something concrete that exists. I have all the tools to do this Drain music. We created the whole universe and locked down the style, and now everything comes easy. I still want to experiment, though. I try not to get too comforta", "p": "The FADER", "d": "2019"}, {"t": "I see it, it's cool. I'm just happy to put out an energy. I always had this idea of creating something beautiful. Now, I'm making it into something real that you can see and hear, and I'm happy that people can fuck with it and make it their own, or just get inspired by it.", "p": "The FADER", "d": "2019"}, {"t": "Just going down YouTube recommendations is how I find so much music.", "p": "The FADER", "d": "2019"}, {"t": "I like to reinvent Bladee. When I get tired of something, I just want to move onto the next part of the saga.", "p": "The FADER", "d": "2019"}, {"t": "The more comfortable you get in yourself, the more your true light shines through. Once you stop taking in outside influences and trying to please other people, that's when you can really start going crazy with your craft. People need to listen to their inner voice, because it can't be wrong if it's", "p": "The FADER", "d": "2019"}, {"t": "Everything is poetry — music in general, pictures. But lately I've been trying to say less in my songs. Sometimes I think I said too much, and it's deeper if you can say less, because you really say more. When you've said too much, you're getting away from the point. When you can express a feeling i", "p": "The FADER", "d": "2019"}, {"t": "When I was making Eversince, I was always thinking lyrics in my head and writing them down. Lately I've been going off top, bar for bar, just punching in and going in the studio, listening to the beat and writing something right there. It's automatic. I'm better at English now, too, so I've got more", "p": "The FADER", "d": "2019"}, {"t": "When we started, I was like, No one's going to want to listen to my broken English. But people fuck with it, and now I got better. I lived in London for two years and [English] sounds more natural for me. When you're speaking a different language — or when I started, anyways — [it felt] like it wasn", "p": "The FADER", "d": "2019"}, {"t": "I created Bladee first as a character, and then I grew into it and found how to be the truest version of myself.", "p": "The FADER", "d": "2019"}, {"t": "Icedancer was over a summer and a winter where I was starting to be more positive. I was recording a lot of songs in between albums with whitearmor. Ripsquad was sending me a lot of beats, and it became a tape.", "p": "The FADER", "d": "2019"}, {"t": "I always like the new music we're making the most. It's always the songs I just made last week that I'm like, Yeah, that's my favorite song. I really like Eversince, I still play those songs live. There's also a lot of music that I wish I didn't put out that I find not great, but it's out and I can'", "p": "The FADER", "d": "2019"}, {"t": "Music was a really good way for me to vent, and it just sounded hard to talk about that shit. But now, I feel a little more responsible, because there's a lot of young people listening to my music, and I don't want to make it sound cool to be depressed or to dwell on these feelings. I put the worst ", "p": "The FADER", "d": "2019"}, {"t": "You listen to sad music to get out those feelings, and a lot of people can use it to get the sadness out, but you mustn't stay in the sadness and get even sadder. You should put your sadness out onto the song. Sing it out with me, and you feel better.", "p": "The FADER", "d": "2019"}, {"t": "That's something that I've always wanted to be able to do. You know how some pop songs are just one word, but it's enough to make a crazy song? I don't like to over-explain. Where I'm at now, I feel like this is a more universal language. You don't have to be able to exactly relate to the story I'm ", "p": "BOMB Magazine", "d": "2021"}, {"t": "I'm really into spiritual stuff, so that's obviously influenced my music-making.", "p": "BOMB Magazine", "d": "2021"}, {"t": "It's funny you say that because I'm super inspired by her. About a year ago I bought this book about her art, and another that's all her notes and philosophy. I was really into it; she's receiving images and using some spirit language to paint pictures.", "p": "BOMB Magazine", "d": "2021"}, {"t": "I'm trying to make it up myself. I take a little bit from things that I'm into, and the whole thing kind of came from the fact that I was able to build these worlds or universes in my music and to create within this kind of universe myself.", "p": "BOMB Magazine", "d": "2021"}, {"t": "What works for me is just following stuff that is beautiful and inspirational to me. These things that make me excited are what is divine to me, the shiny golden things that make the path you take.", "p": "BOMB Magazine", "d": "2021"}, {"t": "When I was coming up with lyrics for these songs, I felt like there was a hook, and a verse, and another verse; but as I was writing it down I realized, 'Wait, this is just kind of the same thing over and over.' It just changes slightly each time.", "p": "BOMB Magazine", "d": "2021"}, {"t": "With this really stupid, basic level you can put whatever meaning you want into it. It leaves space for the listener's own associations. When I wasn't as confident in my own music-creating, I had to say all this stuff in my lyrics and find themes to use in my music. But the more I do it, the more I ", "p": "BOMB Magazine", "d": "2021"}, {"t": "What really got me into s
