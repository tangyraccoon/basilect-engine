pirituality was reading these Hilma af Klint texts. When I was reading about how she made her works, something clicked for me. She made systems of all this stuff, which was really inspiring to me, because I've always been into that kind of thing. I've always had colors that ", "p": "BOMB Magazine", "d": "2021"}, {"t": "My philosophy is that there are infinite ways of looking at this universal truth or wholeness, and every expression or way of looking is equally valid.", "p": "BOMB Magazine", "d": "2021"}, {"t": "In the world we live in, it's not possible to achieve this. Striving for the beauty or the glory is sometimes enough. Maybe that's the most important part.", "p": "BOMB Magazine", "d": "2021"}, {"t": "My YouTube algorithm at that time was pretty crazy. I had been looking at Russian ballet videos, and we were listening to some weird Dutch Italo-disco stuff. I was listening to a lot of binaural beats.", "p": "BOMB Magazine", "d": "2021"}, {"t": "That's part of why we worked together, because it's like, kind of a different sound from what I would normally do. I don't maybe think as much of the process and these aspects of what a song is.", "p": "The Harvard Crimson", "d": "2021"}, {"t": "The actual making of the song is very intuitive. We just made it in one go pretty much and then we would do this kind of exercise where we, by listening to it, try to decide, 'What's the best form?' Then we'd have the original vein of something that just kind of came to us without contemplating.", "p": "The Harvard Crimson", "d": "2021"}, {"t": "We definitely feel like we would have made this project or something that sounded like this at one point, anyway, because we both have been really into exploring these kinds of songs.", "p": "The Harvard Crimson", "d": "2021"}, {"t": "We wanted to do something that's actually like a real event so that it feels like this happened. Because otherwise, we would just release the album [and] it would be some numbers online.", "p": "The Harvard Crimson", "d": "2021"}, {"t": "You get tired of hearing yourself. Even if I'm not talking from my own perspective, or am talking about something that never happened, those feelings are still real. The lyrics are like painting a picture. You want to make it look nice—you want to decorate it.", "p": "032c", "d": "2023"}, {"t": "I can't do anything when I have to. I can't work in any other way. So, in that way, it's effortless. If I feel pressured to do something, then I won't do it!", "p": "032c", "d": "2023"}, {"t": "We always arrive at something interesting through the music that we didn't expect. We never set out to play huge shows or to have a cult fanbase, but there's always something fun and unexpected happening.", "p": "032c", "d": "2023"}, {"t": "I don't think about what the fans think. We have always done what we do, and the good thing that comes from that is we do it ourselves, and we don't let other people control what we're doing.", "p": "032c", "d": "2023"}, {"t": "There's always a core idea that's based in truth, but it's more about the feeling that it gives. I think you can always hear when something is true, like in its essence.", "p": "032c", "d": "2023"}, {"t": "What's the best thing you can make that you haven't been able to achieve? That's always the goal.", "p": "032c", "d": "2023"}, {"t": "So special. That time in London, it was just creation. A lot of stuff sprouted from what was going on there. Even if it was on a small scale in London, if it was just for the people involved mostly. But it inspired so much, and I feel like Benjy was definitely the key player. Benjy was the glue.", "p": "PAPER Magazine", "d": "2024"}, {"t": "I feel like that's also something with working with Benjy, things always take on epic proportions. We started out in Thailand and we were listening to one of your mixes. You're always in our minds, even when we don't talk. But then, we were like, 'Let's make a project.' It was a very last-minute thi", "p": "PAPER Magazine", "d": "2024"}, {"t": "That also felt like a full circle to get Daniel on board. I mean, the artwork was also kind of us just throwing out ideas first. We started with the cross imagery, and then the frog came in. But now since we dropped it, I feel like it got really deep and really represented the album in a good way, t", "p": "PAPER Magazine", "d": "2024"}, {"t": "Everything came together kind of last minute. I wasn't sure what this album was going to be or if it was good or not. Up until this last week. I knew we had something, but I didn't know how it was gonna hit.", "p": "PAPER Magazine", "d": "2024"}, {"t": "Me and Jonatan had been in Miami doing some work. I was going back to Sweden. I was in the airport. And Lucio texts me that Benjy had made this intro and wanted us to speak over it. And so I did that on a voice note in the airport. We just kind of freestyled it.", "p": "PAPER Magazine", "d": "2024"}], "meta": {"quote_count": 39, "source_count": 5, "date_range": ["2019", "2024"], "corpus_valid": true}}, "boy_harsher": {"quotes": [{"t": "It's hard to know how something I've made will access others, but people do tell me that our music evokes those feelings, maybe also provides kinship. Heartbreak is universal, right? I'm trying to touch feelings when I write, so I shy away from anything too literal or anecdotal. That way you can rep", "p": "Dazed", "d": "2019"}, {"t": "I like music that immediately transports you to a location or an idea or a narrative – some feeling. And that's what we are shooting for when we make our music, just something that takes you somewhere else immediately.", "p": "Dazed", "d": "2019"}, {"t": "For me, music is more of an exercise of accessing my emotions. That can be very therapeutic.", "p": "Dazed", "d": "2019"}, {"t": "Writing has always been a tool that has helped me express myself during extreme highs and lows. Writing is this challenge, you gotta translate what's going on in your brain or in your cosmic emotional indeterminate space. I've always tried to write as an exercise in explanation, because often I get ", "p": "Dazed", "d": "2019"}, {"t": "During the initial recording process at our friend's studio in Baltimore, I thought that a lot of the songs were super silly. I mean, there's a guitar solo in \"Country Girl\"! I thought, \"Okay, this release gonna be light,\" but then, after actually listening to the songs all together, I discovered th", "p": "Dazed", "d": "2019"}, {"t": "We focus on making sure our videos exist in the same world as our music. It's less about story then it is about aesthetic and vibe.", "p": "Dazed", "d": "2019"}, {"t": "The videos we've made we've always tried to run with an emotive keyword. When people make videos for us, we steer them in terms of the song's essence, and what we need the overall vibe to be.", "p": "Dazed", "d": "2019"}, {"t": "It's really important, I think. When you're writing music, you're envisioning where it's going to be performed and where it's supposed to exist. What we've been focusing on and what we've been feeding off of for the last few years is playing shows that are really dance-oriented. It's body music. We ", "p": "Dazed", "d": "2019"}, {"t": "I was in the studio every day trying to make something and nothing made sense. We just got done with two years of heavy touring and I felt like we were really starting to harness that energy. It felt like our next record, if Covid hadn't happened, would have been really club-ready. But suddenly, pla", "p": "Crack Magazine", "d": ""}, {"t": "We've always been obsessed with dance music and that kind of in-person engagement. We were writing during a moment when that was the ultimate danger: being in a public space and dancing.", "p": "Crack Magazine", "d": ""}, {"t": "Everything I write is kind of horror-based, because I do believe horror to be the best metaphor for grief. A lot about living is about trying to process the loss of life.", "p": "Crack Magazine", "d": ""}, {"t": "We had these songs that are all over the map, and we wanted to give the meaning, so we wrote this script together. It's important to us for our albums to have a narrative, a cohesion and a cinematic quality.", "p": "Crack Magazine", "d": ""}, {"t": "That is the dream. It's funny, we spent this whole time trying to find our space and figure out who we are, and we've realised that we're just never going to. That's one thing I wish people told you: you're never going to find your place, and no one's going to tell you where you fit in. We just want", "p": "Crack Magazine", "d": ""}, {"t": "I'd still be making this stuff if no one was listening. I can feel pretty broken sometimes, and there's something about sticking your hands in these sounds, and controlling them, that makes me feel normal, at least for a little while.", "p": "The Fader", "d": "2022"}, {"t": "It's a motif we return to because it's a fantasy everyone has. Part of the reason we love driving around is that the idea of disappearing is so alluring. For The Runner, we had the idea for this character who needs to flee all these disastrous situations she herself has created; she's the ultimate s", "p": "The Fader", "d": "2022"}, {"t": "It's always these same characters, who are maybe our alter egos. We just rearrange and make new scenarios for them.", "p": "The Fader", "d": "2022"}, {"t": "We're old now, and we're in a pretty locked life situation. You can no longer be the little monster that lives inside you. But you can write that little monster into any situation you'd like, when you're an artist.", "p": "The Fader", "d": "2022"}, {"t": "When we listened to the tracks that felt the most succinct together, it sounded like a soundtrack, and we love soundtracks. Then we realized, \"Wait a minute! We want to make the movie too!\"", "p": "The Fader", "d": "2022"}, {"t": "I call that my Jim Morrison moment. We knew at that point what the movie was, and we knew we needed something that had written-in catharsis. I was trying to do that '70s swagger.", "p": "The Fader", "d": "2022"}, {"t": "In the beginning I was really inspired by projects like Profligate and Delroy Edwards that could take club music and make it so raw and physical. Something just clicked with me and I realized synth and electronic music can have so much power and control.", "p": "Music and Riots", "d": ""}, {"t": "We started performing live in front of a lot of noise audiences – at regional underground festivals like INC in Miami. The performers were so confident and bold, a lot of intense power electronics. I just remember wanting to compete – like I can be aggressive too, which has stuck with me throughout ", "p": "Music and Riots", "d": ""}, {"t": "The idea of blending hard aggressive songs with vulnerable songs is something we were exploring with at our first shows. I find playing a string of hard tracks wears you down and primes you for the slower more emotional tracks.", "p": "Music and Riots", "d": ""}, {"t": "There's definitely vulnerability in aggression, in shame, in lust, in anger. We aren't commercially soft, but we explore helplessness and fear – which I think is liberating. Being able to get some authentically ugly feelings out there – is a release.", "p": "Music and Riots", "d": ""}, {"t": "The songs we're drawn to in the studio are always tracks we have a strong visual connection with. They can't just sound good. There needs to be a hallucinatory reaction.", "p": "Music and Riots", "d": ""}, {"t": "We love to generate music that evokes a sense of place and feeling. We are definitely chasing the ultimate score album – where all you need to do is close your eyes and you're watching the dark road through the windshield.", "p": "Music and Riots", "d": ""}, {"t": "Our songs are primarily melody and scale based. It's easy to hit a wall where everything is too perfect, too in harmony. There's enough instruments playing the same notes and it just becomes elevator music. I'm looking for a way to pervert the sound or scale a touch, so it breaks out of the comfort ", "p": "Music and Riots", "d": ""}, {"t": "I try to defy 'goth' performance tendencies – although I'm really scared (normal) and perhaps should just stand still, I have so much fun thrashing around like an idiot. I also don't stop myself from smiling, which according to many audience members is not common.", "p": "Music and Riots", "d": ""}], "meta": {"quote_count": 27, "source_count": 4, "date_range": ["2019", "2022"], "corpus_valid": true}}, "clairo": {"quotes": [{"t": "He helped me find the sound I've always wanted. When I listen to the records he's worked on, I don't know how he does it – I can't recognise anything, it all sounds so different.", "p": "Crack Magazine", "d": "2024"}, {"t": "I let a whole team of people just do what they do best rather than doing it all myself. I'd be like: keep going with that feeling.", "p": "Crack Magazine", "d": "2024"}, {"t": "I'm just letting people into the process and the music is better for it.", "p": "Crack Magazine", "d": "2024"}, {"t": "Yeah, I think the pendulum's swinging in terms of people craving something tactile, things that feel like a long-process-type experience.", "p": "Blackbird Spyplane", "d": "2024"}, {"t": "We've gotten to a point where you're being bombarded with so much new information and so many things that you wonder, What was happening before all this? I've tried to implement some of that in the way I make music now, studying records I love and trying to learn how they recorded them.", "p": "Blackbird Spyplane", "d": "2024"}, {"t": "My collection's not that crazy, I have maybe 60 or 70 of them. But even if it's a record ripped from 45 onto YouTube, I'll fall in love with imperfections in the way it was ripped, like a scratch on the record, or if something in the recording is way too loud.", "p": "Blackbird Spyplane", "d": "2024"}, {"t": "Tin whistles are underrated. I want to give them a new lease on life.", "p": "Blackbird Spyplane", "d": "2024"}, {"t": "To me, it's better to have a process where you've been working on it for so long, to where people's opinions are so far away that you just end up writing what you want.", "p": "The Creative Independent", "d": "2025"}, {"t": "It's really just about letting yourself have phases. Then you end up knowing so much music.", "p": "The Creative Independent", "d": "2025"}, {"t": "I think it's really important to look for nice people who have a huge amount of references, and who can also go as deep as you want or as surface as you want.", "p": "The Creative Independent", "d": "2025"}, {"t": "I do think that there's something on every album that still represents the current me.", "p": "The Creative Independent", "d": "2025"}, {"t": "I never really like to stay the same, anyway.", "p": "The Creative Independent", "d": "2025"}, {"t": "It's definitely more about getting to the source and the real sound.", "p": "The Creative Independent", "d": "2025"}, {"t": "I think talking about references and sending tracks back and forth is what gets everything flowing and everyone on the same wavelength.", "p": "The Creative Independent", "d": "2025"}, {"t": "It's not even performing. It's not even being in the studio all the time. It's music in general that has become, and has always been, the most important thing to me.", "p": "The Creative Independent", "d": "2025"}, {"t": "I'm feeling it first, then the words come second.", "p": "Interview Magazine", "d": ""}, {"t": "Well, the process is everything.", "p": "Interview Magazine", "d": ""}, {"t": "I also hate everything that comes with trying to explain your record or trying to make it a story.", "p": "Interview Magazine", "d": ""}, {"t": "Finding a narrative in your album can be kind of therapeutic after it's made. Right after I made this record I was like, 'I have no idea what this thing is.'", "p": "Interview Magazine", "d": ""}, {"t": "The more time I spent away from it, the more I understood exactly what it was about, and then I could talk about it.", "p": "Interview Magazine", "d": ""}, {"t": "Having to explain the overarching meaning of your record is so difficult, because at least for me, there's parts of myself that I literally cannot communicate unless it is through this medium.", "p": "Interview Magazine", "d": ""}, {"t": "Miserable? Oh. Probably revisiting something that was euphoric and in the moment. It's not authentic to the feeling.", "p": "Interview Magazine", "d": ""}, {"t": "Margo Guryan is a really good example of someone who's sexy without you knowing anything. Her vocals are very close to the microphone and she's talking about love, but it's never explicit.", "p": "Interview Magazine", "d": ""}, {"t": "There's something that's left to be desired, which really resonates with me. I want the audience to understand that, with me, it's never going to fully be given.", "p": "Interview Magazine", "d": ""}, {"t": "Totally. Well, I know we have talked about Blossom Dearie in the past. I have this record of hers and on the back it says, 'Blossom Dearie sings like she's sitting in your lap.'", "p": "Interview Magazine", "d": ""}, {"t": "That changed the trajectory of my record completely, because that's so hot and so sensual and charming and mysterious, but it's still so sweet and simple.", "p": "Interview Magazine", "d": ""}, {"t": "I want to do something like that. I want them to feel like I'm in their lap telling them things in their ear.", "p": "Interview Magazine", "d": ""}, {"t": "I think I'm a person who is recently discovering sensuality and femininity in myself. It's something I never fully tapped into.", "p": "Interview Magazine", "d": ""}, {"t": "I didn't understand my own strain of sexy. I didn't know how to lean into it, and I didn't know what it meant to me.", "p": "Interview Magazine", "d": ""}, {"t": "Yes. And 'She Don't Use Jelly' is a huge song for me. I'm obsessed with that song, but also Soundgarden. And I mean, Nirvana.", "p": "Interview Magazine", "d": ""}, {"t": "I could never write a record that wasn't about something I'd experienced.", "p": "NME", "d": "2019"}, {"t": "I didn't want to have to rely on anyone else. When it came to me wanting to sing a song and perform something, I was just like, 'Fuck it, I'm gonna do it.'", "p": "NME", "d": "2019"}, {"t": "I definitely did not know what the hell I was doing. I was just writing about relationships that I'd never had and pretending that I knew what that was like. For a while, I was scared about writing my own music. I was afraid it was going to be bad.", "p": "NME", "d": "2019"}, {"t": "Instead of wanting to learn the first songs you learn to play, I just automatically wanted to start playing songs that I knew.", "p": "NME", "d": "2019"}, {"t": "There's a mix of really calculated parts to reflect the calculated energy you have in a first experience with someone and moments where it feels really playful, like flirtiness.", "p": "NME", "d": "2019"}, {"t": "I'm not necessarily the most educated on how to do things, but I definitely have the ideas to execute.", "p": "NME", "d": "2019"}, {"t": "I remember listening to 'California English' for the first time and being like, Whaaaat?! That whole era was so important for music and so important for my upbringing with music. It's so funny to think about how important Vampire Weekend is to me and to be able to work with Rostam on my debut.", "p": "NME", "d": "2019"}, {"t": "I just want to maintain the relationship I have with the people who listen to my music and continue to make full records. I'm more inspired now than ever to make music.", "p": "NME", "d": "2019"}, {"t": "I was completely wrong. It's a really cool thing to be able to see how some of the slower songs or some of the songs that I thought people may not care as much about are sung back to me so loudly every night.", "p": "SPIN", "d": "2022"}, {"t": "When the record was first written, and when I was first talking about it, I did think a lot of it was about—and a lot of it is still about—growing pains into adulthood, raising my dog Joanie and finding new perspectives through my mom. But a lot of it, too, is about finding comfort wherever you find", "p": "SPIN", "d": "2022"}, {"t": "There are so many things I wanted to experiment with on Sling that he was all for. He's great at directing, but he's also great at making you feel and know that it's your record and your song. He was down to make something that he had never made before, which I think was really important for both of", "p": "SPIN", "d": "2022"}, {"t": "Turning the stage into this living room was really important to the sound because I wanted it to feel comfortable. I wanted the show to be surrounded by comfort, understanding and softness. The rugs that we added are all really beautiful, and playing the piano was a new thing for me, which feels rea", "p": "SPIN", "d": "2022"}, {"t": "I love making music and I think that's something I'm gonna always be doing, but I think 'being' or 'having' Clairo as a career is something that I don't know if I want forever. There's a lot of things I need to learn about myself in terms of what other things I'm good at or what other interests I ha", "p": "SPIN", "d": "2022"}, {"t": "I've always wanted to produce for other people see what that feels like or write songs from the people. I love the feeling of being collectively a part of something, I just don't always love being at the forefront of it.", "p": "SPIN", "d": "2022"}, {"t": "It was so amazing. I've only worked with two female engineers this whole time, and Laura was one of them. It was so wonderful to have another woman in the room. It made me feel understood. It made me feel closer to the work.", "p": "SPIN", "d": "2022"}, {"t": "Just her overall energy. She's really kind and understanding. It does help to have another woman in the room when you are writing about primarily female or female-identifying experiences. It just helps. She can nudge you along your own insecurities with it. She can help you feel more confident when ", "p": "SPIN", "d": "2022"}, {"t": "He is so funny. When we started working together, I was really intimidated, of course, by his track record and everything that he works on and his level of success. I was nervous that I wasn't gonna meet a certain standard. But he's so down to earth. He's very free and open about whichever way a son", "p": "SPIN", "d": "2022"}, {"t": "I mean, I say I'm taking a break and then I start writing again. So, I don't know when this break is ever gonna truly happen. But I have started, and it feels so good. I think it's gonna end up being a blend between the first two records, which feels right. But I'm also going to let this one simmer ", "p": "SPIN", "d": "2022"}], "meta": {"quote_count": 56, "source_count": 6, "date_range": ["2019", "2025"], "corpus_valid": true}}, "fishmans": {"quotes": [{"t": "I've been addicted to the sense of \"the music takes me somewhere else\" for 30 years. However, I reflect seriously on the fact that I haven't done anything realistic and I know too little about the world, so sometimes I even worry about myself. But as a musician, I can't help being attracted to the m", "p": "TOKION", "d": "2021"}, {"t": "Private studio was a great revolution. For us—especially for Sato-chan, it was a dream come true. We really got a place where we could always do recording as an extension of daily life.", "p": "TOKION", "d": "2021"}, {"t": "When we were using a big studio, there were a lot of people around us, and we had a lot of things to worry about besides music. The less such things we had, the better Fishmans became.", "p": "TOKION", "d": "2021"}, {"t": "I think it's like putting a part of everyday life into music. Fishmans music never draw conclusions, nor does it seek conclusions. A part of a certain life is cut out, and it continues endlessly. It's both kindness and rigor.", "p": "TOKION", "d": "2021"}, {"t": "I realized that everyday life is the most dramatic. The greatest treasure for me is the feeling of joy, sadness, and indescribable emotion when the sun is about to set. I think my own perspective on finding or not finding trivial things in everyday life changed through the encounter with Fishmans mu", "p": "TOKION", "d": "2021"}, {"t": "The trivial things are the most moving. That's why I feel happy and sad, then I have my life that continues.", "p": "TOKION", "d": "2021"}, {"t": "The written lyrics are not the only message in a song, but each sound with no words definitely has emotions.", "p": "TOKION", "d": "2021"}, {"t": "In my case, in terms of Fishmans songs, the importance of making sounds had increased over time. For example, at the exquisite moment of changing the mood of song, I hit the cymbal only once. The sound of the cymbal at the moment of the song's peak has a great influence. The responsibility for such ", "p": "TOKION", "d": "2021"}, {"t": "For the drum solo of \"LONG SEASON\", I tried to convert what came to my mind into sound as much as possible. The theme of my solo was \"fireworks I saw during a summer vacation.\" In response to the lyric: \"What do you remember?\", I answered with the drum solo, \"I remember the fireworks exploded by the", "p": "TOKION", "d": "2021"}, {"t": "If you look at the wavelength of sounds from Fishmans' recording, it's definitely random. But from my point of view, that's exactly the fluctuation of the band sounds that other people don't have, and that's why our band is called \"Fishmans\" isn't it?", "p": "TOKION", "d": "2021"}, {"t": "He showed us how to strip things back, and reduce our music to the bare essentials. I feel like Zak taught us a lot about how to generate a sense of tension. When you keep adding sounds, you lose that.", "p": "Tokyo Dross / Japan Times", "d": "2019"}, {"t": "To borrow a phrase from Sato, we were 'just doing it,' but 'just doing it' takes real single-mindedness. It's about devoting yourself completely to the task, and moving gradually forward, until eventually you end up with something like Long Season.", "p": "Tokyo Dross / Japan Times", "d": "2019"}, {"t": "I don't get nostalgic doing it at all. If the music felt like a throwback when we played it, I don't think I'd be as interested in doing shows.", "p": "Tokyo Dross / Japan Times", "d": "2019"}], "meta": {"quote_count": 13, "source_count": 2, "date_range": ["2019", "2021"], "corpus_valid": false}}, "nujabes": {"quotes": [{"t": "I used to make music back in high school, but I just couldn't get fully into it and so I stopped. The reason I started making tracks again was because I wanted to hear music which sampled all the old soul and jazz that I liked.", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}, {"t": "At first it wasn't so much me trying to make actual songs as it was just seeing what would happen when I took a sample from one record, made a loop out of it, and layered another sample over that one. I got so much pleasure even from just creating those phrase loops—when I made my first one I spent ", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}, {"t": "When I first learned of the Propellerhead ReCycle!, I was going, \"I can't believe something as useful as this exists.\" However, there's simply a clear as day difference between something that was calculated and split up by software, and something that's been cut by hand. It's like the sample loses t", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}, {"t": "Having been doing track making so far, I've finally began to see more clearly the coordinates of what exactly it is I want to express with my sound. If I had to put it into words, it's the things I think in my everyday life; the things I feel… So, as per the album title: \"music as a metaphor.\" There", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}, {"t": "Since I am myself an independent musician, I think it's important I work with MC's who share the same perspective and express the things I personally find important.", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}, {"t": "I could send the finished tracks overseas and just have them record their raps on top of them over there, but if I did that I wouldn't be able to give the MC's any direction on the spot and I wouldn't have any face-to-face contact with them. That's why I don't wish to do that. Sure, it's expensive a", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}, {"t": "Although for me the most important thing isn't sound quality, but rather the process of getting closer to that image of my ideal sound—including with the mixing which I also do myself.", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}, {"t": "While my work on Hydeout Productions will continue to be sample-based, the fact is that there aren't a lot of variables when it comes to programmed music. That's why I want to bring things like Cycling '74 Max/MSP to my work, and I'm now researching all that with Nao as URBAN FOREST. Utilizing softw", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}, {"t": "Everything at the store is stuff I went and bought overseas myself, and my hope is for people to come in, listen to old records at their leisure, and hopefully feel inspired by those records to make good tracks themselves.", "p": "kumomi (transcription of Sound & Recording Magazine)", "d": "2003"}], "meta": {"quote_count": 9, "source_count": 1, "date_range": ["2003", "2003"], "corpus_valid": false}}, "radiohead": {"quotes": [{"t": "We would really love to do stuff that's more throwaway, in the sense that it's not a big body of work making a big statement. It's like, \"This is what we're doing today.\" It's quite a difficult mindset to stay in for a long period.", "p": "Magnet Magazine", "d": "2003"}, {"t": "They've ended up like that, yeah. I think [Thief] is like that as well, but that's just [a result of] you sitting down with what you've got and you discover there's a trail running through it.", "p": "Magnet Magazine", "d": "2003"}, {"t": "Well, I'd like to see them sit down and calculate the songs as well. Because no cleverness ever comes unless the work itself is in some way convincing. That's the joke. It'd be impossible for me to calculate something before it happens and then make it happen. It would just be shit. It completely de", "p": "Magnet Magazine", "d": "2003"}, {"t": "I still make music and get involved with this band because the things that are really getting to me—whether they be making me miserable or angry or joyful—they always have to come out through the music. If you come to your art with this mood and just try to put it straight down, it's a longer and ha", "p": "Magnet Magazine", "d": "2003"}, {"t": "It's about actually catching yourself unawares rather than this whole thing of thinking, \"Here we start working on new material, in this new session\", which can sometimes feel a bit daunting. So we're trying to catch ourselves on the fly, and see what comes out of that.", "p": "Drowned in Sound", "d": "2007"}, {"t": "The songs themselves have always been paramount – we work as a group of five people, and with Nigel, in trying to find the best or most appropriate way to bring those songs out. That's your focus, rather than thinking about it too individually.", "p": "Drowned in Sound", "d": "2007"}, {"t": "We all tread lightly with each other, but at the same time you recognise that if you don't broach certain subjects then they're likely to trip the whole project up. Compromise is a good thing, isn't it? Every band is a compromise.", "p": "Drowned in Sound", "d": "2007"}, {"t": "[Composing] is more solitary, you're alone in a room with a paper and piano for months without seeing another human. Although it does make it difficult for [the rest of Radiohead] when I come back to them. I'm always over-keen and over-eager to do something social and communal.", "p": "The Quietus", "d": "2019"}, {"t": "That album was the first time I've managed to get my hands on a Radiohead song when it was just a drum machine and a vocal line. Usually strings are just decoration, there's not much room left for them, but it's taken me these many albums to get the confidence to say 'let's just leave this song here", "p": "The Quietus", "d": "2019"}, {"t": "When we're recording there's always lots of options about how to make reverbs and echoes. Some of them are mechanical, there's one that's called a palm speaker. It's a speaker inside a box with strings strung across it, and that resonates according to certain frequencies and sounds a bit like an ech", "p": "The Quietus", "d": "2019"}, {"t": "I always get to the end of this stage, a crazy and intense process of months and months of preparation, then one concert then it's all gone… I just feel the urge to instantly retreat back to the guitar and laptop.", "p": "The Quietus", "d": "2019"}, {"t": "As long as I'm surrounded by instruments, I'm happy, whatever it is I'm doing.", "p": "The Quietus", "d": "2019"}, {"t": "Almost every tune is like a collage, you know. Things we prerecorded, each of us, and then were flying at each other. It's like editing a film or something. It's quite interesting. The melodies were there but so much was implied so that when you did embellish, it was like, whoa, you know, it really ", "p": "NPR", "d": "2011"}, {"t": "Not really trying to necessarily be experimental or anything. You see, you're constantly learning from other music, right. And then there's that Lennon thing... it's not who you steal from, it's how you steal. You know, I'm constantly absorbing other music. And that's what stimulates me the most. An", "p": "NPR", "d": "2011"}, {"t": "What it forced you to do was you had to simplify what you were doing. You couldn't do loads of ideas. Probably the most important thing is you had to listen to one another. Believe it or not, that's also something that - in a band you can lose that. You can get so wrapped up in what you're doing, yo", "p": "NPR", "d": "2011"}, {"t": "The part of what you do is rejection. There's a big part of that. A lot of the time, it is like hitting your head against the wall and then you have breakthroughs. But I think what's great about the environment that we have is that no one ever says, well, you can't do that. You try it and then it's ", "p": "NPR", "d": "2011"}, {"t": "Our problem, I think, sometimes is you have a momentum thing when you're working and if you break the momentum, it's very much harder to go back to it.", "p": "NPR", "d": "2011"}, {"t": "We didn't have a clue how we were going to play a lot of it. And then, like, learning to play it allows you to back into it in another way as well, especially after the initial sort of what the hell is that thing? So, I mean, and in some ways that's one of the ways we move on musically. It's quite i", "p": "NPR", "d": "2011"}], "meta": {"quote_count": 18, "source_count": 4, "date_range": ["2003", "2019"], "corpus_valid": true}}, "skrillex": {"quotes": [{"t": "If you saw how I work, I think it's definitely quite unconventional just because it's all self-taught - I didn't learn conventional production methods. I'm kinda stubborn in some ways too in that, at one point, what I do would definitely not be considered 'production', it would just be considered no", "p": "MusicRadar", "d": "2011"}, {"t": "At the end of the day it's not so much the editing style that matters, it's more about having a real cool, concrete idea. Even if it's a whole line of bits and crazy parts, it still has to stick with you and have... almost like a phrase.", "p": "MusicRadar", "d": "2011"}, {"t": "It's usually about how I'm feeling at the time... I'll never abandon what I've done before but I want to keep growing. I'm always creating new synth sounds and samples when I work, which often take me off in a certain direction, but it's always about who I am.", "p": "MusicRadar", "d": "2011"}, {"t": "I started with Fruity Loops back in the day, then Reason and then I learnt Pro Tools but I kinda hated it so I got Ableton Live, which is just so incredibly intuitive.", "p": "MusicRadar", "d": "2011"}, {"t": "If someone reads something, and it's like 'CRAZY EMO KID TURNED DUBSTEP METAL GUY BLAH BLAH BLAH', then they really don't understand. I'm making all kinds of music, all BPMs. I'm using hip hop and techno and moombahton in my sets! People that experience it will see that I'm not trying to back any so", "p": "Dazed", "d": ""}, {"t": "When people say I 'JUMPED ON THE DUBSTEP BANDWAGON', I just want to say, 'Whoa, whoa, rewind' – there was no fucking wagon when I was making dubstep.", "p": "Dazed", "d": ""}, {"t": "I made that record in my bedroom not really knowing what I was doing, but it just kind of came out.", "p": "NPR", "d": "2014"}, {"t": "I always think it's fun to make sounds that almost sound human — even though they come from a computer, there's something organic-sounding about it. That's where the 'monster' thing comes from, I think: It sounds like someone's actually talking, but every one of those vowel sounds is just a lot of d", "p": "NPR", "d": "2014"}, {"t": "It's funny — when you make music, you don't really think about how you're going to explain it at the end. People are really, really into the idea of, 'What were you thinking of when you made that?' And I don't really think of anything; it just happens, and it's hard to explain.", "p": "NPR", "d": "2014"}, {"t": "I feel like with a lot of records made for DJing, there's always some sort of buildup. Even in techno, where it's really simple, it'll be the same loop over and over again, but then the 'drop' comes... It's a similar, dynamic way of approaching how to write music, but taken in so many different ways", "p": "NPR", "d": "2014"}, {"t": "I always loved electronic music growing up. Bjork was always one of my favorite vocalists and I loved how involved she was with the production, how she took elements of IDM and drum 'n' bass and created something really awesome and melodic.", "p": "NPR", "d": "2014"}, {"t": "The computer was just the way I could express myself, basically. It was just another instrument.", "p": "NPR", "d": "2014"}, {"t": "When I did the record with Chance the Rapper... I recorded his entire band, The Social Experiment — live horns and keyboard solos and all that stuff. I wrote some chord progressions out, had them replay it, reinterpret it. Chance started toasting over it, and it happened really quickly in the sort o", "p": "NPR", "d": "2014"}, {"t": "I feel like people don't take you as seriously unless you've done a 'studio record' — which is OK, but I think it's also important to not limit yourself to that, and show that you can release music and be successful in other ways. Especially in the world of electronic music, kids are so fast and pro", "p": "NPR", "d": "2014"}, {"t": "I feel like anybody that's mixing and mastering alone, it's always hard. When I was in a band, you would write the songs, your producer would record it and that was it. When you're mixing yourself and it's all in the box, in the same place where you've made the record, it's easy to start changing st", "p": "NPR", "d": "2014"}, {"t": "I knew my biggest asset was my mind and my creativity. If that means spending four months scoring a movie called Spring Breakers, an indie film that maybe my main fanbase doesn't care about, it's still my journey. And it might plant seeds for ten years from now – I got GarageBand one day and started", "p": "Dazed", "d": "2019"}, {"t": "It's explosive, but still restrained. There's energy. I wanted something that complemented the sweetness and melancholy of the vocal, but wasn't safe, that still went somewhere.", "p": "Dazed", "d": "2019"}, {"t": "There's something really similar about all creative people, whether it's Mariah Carey or a young person who has no hits but they're on fire with the creative language that we're all speaking. When I first walked into the studio with Mariah Carey – and she's an incredible songwriter, a lot of people ", "p": "Dazed", "d": "2019"}, {"t": "You saw Avicii doing a record that's country. You saw rappers mimicking screamo artists. You heard electronic music and rap music. I don't think we've ever been in a decade that takes other elements like we have.", "p": "Dazed", "d": "2019"}], "meta": {"quote_count": 19, "source_count": 4, "date_range": ["2011", "2019"], "corpus_valid": true}}, "tame_impala": {"quotes": [{"t": "When I was 12 my brother was recording himself on a boom box playing drums, because he wanted to hear what he sounded like. When he was finished I walked in and recorded myself playing drums for 30 seconds. I realized if I played that back into a new tape deck, whilst also playing a keyboard along w", "p": "Tape Op", "d": ""}, {"t": "The first time I went to a studio was in Perth, Australia, and I didn't find it very enjoyable. All of a sudden I was out of this world where I was able to do everything for myself. I was in this time-constrained environment where there were other professionals walking around telling me how to do th", "p": "Tape Op", "d": ""}, {"t": "I didn't have a good first few studio experiences — it felt like as soon as another professional got involved they assumed they knew how things should sound more than me. I believed them for a while, like maybe they did know better, but then I just retreated back to my bedroom. I eventually decided ", "p": "Tape Op", "d": ""}, {"t": "Using an electronic recording platform to make psychedelic rock music just seemed to work. Electronic producers want to have easy access to things like filter sweeps and other ways of fucking with the sound like a DJ would. I'm always trying to find ways to make the psych rock sound less rock.", "p": "Tape Op", "d": ""}, {"t": "I think that most of the magic happens in the first few hours of working on a song. By the time I get to the mixing stage, I'm terrified to change anything. There's this intangible thing that happened in the first few hours of recording, and I feel like I have to hold on to that. If I change somethi", "p": "Tape Op", "d": ""}, {"t": "One day I put my finger on one of the keys and I went fucking insane. He had the portamento/glide on; I played a lead line and I thought it was the most amazing sound I had ever heard. It had emotion, but it wasn't a guitar or anything organic; it was totally synthetic. I realized that it's a total ", "p": "Tape Op", "d": ""}, {"t": "You never finish it, you just run out of time. So I went back; he spent an hour doing the recall, and we bumped down the drums. That was it. At one point I was sitting there pulling my teeth out because I was frustrated. I asked him, 'Maybe turn down the top snare a little bit? Can you hear the diff", "p": "Tape Op", "d": ""}, {"t": "The way I see it, I drink to escape the pressure and I smoke weed to escape overthinking things. At about 5pm, I'll have a drink and a spliff and keep recording. I try to enjoy myself and wait until something comes to me, recording until I fall asleep—going deeper and deeper into that process. Becau", "p": "Vice", "d": ""}, {"t": "I couldn't even think about new Tame Impala music for a long time. Those things were just… they didn't have that pressure. They didn't have the weight of responsibility that Tame Impala has.", "p": "Vice", "d": ""}, {"t": "It's everything to me. Something I can call my baby. Because nothing else that I do in music is my baby as much as Tame Impala music. In a way, it's what my entire sense of self and purpose rests on. I realised that there's something I get out of making Tame Impala music that nothing else can give m", "p": "Vice", "d": ""}, {"t": "I don't expect people to be on the journey with me the whole way. I expect people to get on the train and get off the next station. It sounds like I don't care about my fans, but in a way, I'd be slightly disappointed if everyone that liked the first album liked every album after that. It's one of t", "p": "Uproxx", "d": "2020"}, {"t": "My scope has just widened. Back then, I was terrified of doing anything other than what I knew how to do and what I liked listening to. I guess I wasn't as brave as I am now. Just by attempting things that I'm not fully confident with, or things that seemingly belong to a different world of music th", "p": "Uproxx", "d": "2020"}, {"t": "I was a shy person. I was shy personally and musically. The fact that everyone thought it was a band is an example of how shy I was musically. I didn't even want to tell people that I made the whole thing by myself.", "p": "Uproxx", "d": "2020"}, {"t": "I listen to it and I just think it sounds cute because it's like, \"Oh my God. This kid doesn't know what he's doing.\" But the best kinds of music are like that, right? You're just like, \"This artist doesn't know what they're doing,\" and that's what makes music exciting sometimes.", "p": "Uproxx", "d": "2020"}, {"t": "I had just this sudden bolt of confidence, and ambition, and boldness. I just felt fearless. There are more pop songs on Lonerism than the first one or anything I'd done before. Even though the sound is totally gnarled and blown out, to me it sounded like Backstreet Boys in some of it, or it sounded", "p": "Uproxx", "d": "2020"}, {"t": "Usually, the first half is amazing and new, and I feel on top of the world. Then the second half of making the album is when I feel underneath the world. I feel the world's weight. Making Lonerism was probably one of the most creatively fertile times of my life. Then, of course, putting it all toget", "p": "Uproxx", "d": "2020"}, {"t": "I just wanted to make a high fidelity album as a way of the pendulum swinging from Lonerism. I was listening to a lot of R&B at that time, really clean, impactful sounds. So I just wanted to make a silky album. I wanted to embrace being a producer more because I started to idolize hip-hop producers ", "p": "Uproxx", "d": "2020"}, {"t": "When I was making this one, I had to embody a bit of a Kanye West perspective on it, which is like, it's finished when it's finished. Don't f*cking rush me. No one can rush me. Not the record label, not my fans, not even myself. It'll be finished when it's finished. I just had to take on that attitu", "p": "Uproxx", "d": "2020"}, {"t": "One of the things about the way I make Tame Impala albums is there's literally no one else involved in it until it gets mastered. There's no one else they can ask other than me, 'How is progress going?' And because I was just lost in my own head, I thought I could finish it in a month. Turns out it ", "p": "Uproxx", "d": "2020"}, {"t": "I wanted to try and use things from totally different worlds in the way that a hip-hop producer would. To be almost collage-y. Make a soundscape and build a song from there. When I first started putting 'It Might Be Time' together, I was like, \"This is going to be unlistenable.\" Because I didn't kno", "p": "Uproxx", "d": "2020"}, {"t": "Rhythms have always been something that's so important to me. I don't sing rhythmically, but the actual timing of how I sing, I almost consider more important than the melodic aspect. Take a song like \"Elephant\" — most of the parts are one note. For this album, I just wanted to do that even more, ju", "p": "Uproxx", "d": "2020"}, {"t": "I want to be more liberal with myself creatively because I'm so inspired these days by the idea of just being like, \"F*ck it,\" and not being precious, and not overthinking things in the way that I probably did early on. InnerSpeaker, I overthought it. Lonerism, I labored over it. I don't want to lab", "p": "Uproxx", "d": "2020"}, {"t": "I started out my career with that kind of anti-synthesizers mentality. It took me a while to embrace them. I liked to think that whatever sound you could get with synthesizers, you could get using a gu             const connections = DISCOVERIES.filter(d => d.a === artist || d.b === artist)
                .sort((a, b) => b.s - a.s);

            const quotes = Q && Q[artist] ? Q[artist] : [];

            let html = `
                <div class="artist-detail-header">
                    <button class="back-button" onclick="showPage('artists')">← Back to Artists</button>
                    <h1 class="artist-detail-title">${formatArtistName(artist)}</h1>
                    <div class="artist-detail-tags">
                        <div class="detail-tag">${meta.q} Quotes</div>
                        <div class="detail-tag">${meta.src} Sources</div>
                        <div class="detail-tag">Period: ${meta.r}</div>
                        <div class="detail-tag">${meta.v ? 'Valid Dataset' : 'Partial Data'}</div>
                    </div>
                </div>

                <div class="connections-section">
                    <h2 class="section-title">Connected Artists</h2>
                    <div class="connections-pills">
            `;

            connections.forEach(conn => {
                const other = conn.a === artist ? conn.b : conn.a;
                html += `
                    <div class="connection-pill" onclick="goToArtist('${other}')" style="cursor:pointer;">
                        ${formatArtistName(other)} <strong style="color:#ffc93a;">${conn.s.toFixed(3)}</strong>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>

                <div class="quotes-section">
                    <h2 class="section-title">Production Philosophy Quotes</h2>
            `;

            if (quotes && quotes.length > 0) {
                quotes.forEach(q => {
                    html += `
                        <div class="quote-item">
                            <div class="quote-text">"${q.text}"</div>
                            <div class="quote-source">— ${q.source || 'Unknown Source'}</div>
                        </div>
                    `;
                });
            } else {
                html += `<div class="quote-item"><div class="quote-text">No quotes available for this artist.</div></div>`;
            }

            html += '</div>';

            detailPage.innerHTML = html;
            detailPage.classList.add('active');
            document.querySelectorAll('.page').forEach(p => {
                if (p.id !== 'artist-detail') p.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        }

        // ===== MATRIX PAGE =====
        function renderMatrix() {
            const container = document.getElementById('heatmap');
            container.innerHTML = '';

            const artists = Array.from(uniqueArtists).sort();
            const n = artists.length;

            // Create a lookup for scores
            const scoreMap = {};
            DISCOVERIES.forEach(d => {
                scoreMap[`${d.a}_${d.b}`] = d.s;
                scoreMap[`${d.b}_${d.a}`] = d.s;
            });

            // Header
            const header = document.createElement('div');
            header.className = 'heatmap-header';
            header.innerHTML = '<div class="heatmap-header-spacer"></div>';
            artists.forEach(artist => {
                const cell = document.createElement('div');
                cell.className = 'heatmap-header-cell';
                cell.textContent = artist.slice(0, 3).toUpperCase();
                header.appendChild(cell);
            });
            container.appendChild(header);

            // Rows
            artists.forEach((artist1, i) => {
                const row = document.createElement('div');
                row.className = 'heatmap-row';

                const label = document.createElement('div');
                label.className = 'heatmap-label';
                label.textContent = formatArtistName(artist1);
                row.appendChild(label);

                artists.forEach(artist2 => {
                    const cell = document.createElement('div');
                    cell.className = 'heatmap-cell';

                    if (artist1 === artist2) {
                        cell.style.background = 'rgba(255, 201, 58, 0.2)';
                        cell.textContent = '1';
                    } else {
                        const score = scoreMap[`${artist1}_${artist2}`] || 0;
                        cell.style.background = scoreToColor(score);
                        cell.textContent = score ? score.toFixed(2) : '—';

                        const tooltip = document.createElement('div');
                        tooltip.className = 'tooltip';
                        tooltip.textContent = `${formatArtistName(artist1)} ↔ ${formatArtistName(artist2)}: ${score.toFixed(3)}`;
                        cell.appendChild(tooltip);
                    }

                    row.appendChild(cell);
                });

                container.appendChild(row);
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderDiscover();
        });
    </script>
</body>
</html>
